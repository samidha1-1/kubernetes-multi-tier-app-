apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
      - name: cache
        image: redis:7-alpine
        volumeMounts:
          - name: cache
            mountPath: /data
      volumes:
         - name: cache
           persistentVolumeClaim:
               claimName: cache-data    
