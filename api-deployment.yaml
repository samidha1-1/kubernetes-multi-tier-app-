apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:latest
        args:
          - "-text=esc bash api"
          - "-listen=:5678"
        ports:
        - containerPort: 5678
        env:
         - name: API_TOKEN
           valueFrom:
             secretKeyRef:
                name: api-secret
                key: API_TOKEN  